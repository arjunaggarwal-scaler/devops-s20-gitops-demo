apiVersion: apps/v1
kind: Deployment
metadata:
  name: session20-mini
  namespace: session20
  labels:
    app: session20-mini
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session20-mini
  template:
    metadata:
      labels:
        app: session20-mini
    spec:
      containers:
        # podinfo is a small Go web app pulled from GitHub Container Registry (ghcr.io).
        # The image tag is the ONLY place a version is declared - a GitOps "image bump" is
        # just a one-line change to this value committed to Git.
        - name: app
          image: ghcr.io/stefanprodan/podinfo:6.9.1
          ports:
            - containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9898
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
