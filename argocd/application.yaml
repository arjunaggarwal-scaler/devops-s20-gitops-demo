# Applied ONCE by an admin (kubectl apply -f argocd/application.yaml).
# Kept outside app/ so Argo CD does not try to manage its own Application from the watched path.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session20-mini
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/arjunaggarwal-scaler/devops-s20-gitops-demo.git
    targetRevision: main
    path: app

  destination:
    server: https://kubernetes.default.svc
    namespace: session20

  syncPolicy:
    automated:
      prune: true      # delete cluster objects whose manifest was removed from Git
      selfHeal: true   # undo manual changes made directly in the cluster (drift)
    syncOptions:
      - CreateNamespace=true
